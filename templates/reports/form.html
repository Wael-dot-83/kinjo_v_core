{% extends 'base.html' %}

{% block title %}تقرير يومي جديد{% endblock %}

{% block page_header %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <div>
        <h1 class="h2">
            <i class="bi bi-pencil-square me-2 text-primary"></i>
            تقرير يومي جديد
        </h1>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <form id="reportForm">
            <!-- Child Selection -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label required">الطفل</label>
                            <select class="form-select" name="child_id" required>
                                <option value="">اختر الطفل...</option>
                                <option value="1">أحمد محمد</option>
                                <option value="2">سارة علي</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">التاريخ</label>
                            <input type="date" class="form-control" name="report_date" value="{{ today }}">
                        </div>
                    </div>
                    <div class="row mt-3">
                         <div class="col-md-6">
                            <label class="form-label required">وقت الحضور</label>
                            <input type="time" class="form-control" name="arrival_time" value="08:00" required>
                        </div>
                         <div class="col-md-6">
                            <label class="form-label required">وقت الانصراف</label>
                            <input type="time" class="form-control" name="leave_time" value="13:00" required>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Mood & Health -->
            <div class="card mb-4">
                <div class="card-header bg-light">
                     <h5 class="mb-0"><i class="bi bi-emoji-smile me-2"></i>المزاج والصحة</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label d-block mb-3">المزاج العام</label>
                        <div class="d-flex justify-content-around mood-selector">
                            <input type="radio" class="btn-check" name="mood" id="mood-happy" value="happy" checked>
                            <label class="btn btn-outline-light text-dark border p-3 rounded shadow-sm" for="mood-happy">
                                <div class="fs-1">😊</div>
                                <div class="small">سعيد</div>
                            </label>
                            
                            <input type="radio" class="btn-check" name="mood" id="mood-normal" value="normal">
                            <label class="btn btn-outline-light text-dark border p-3 rounded shadow-sm" for="mood-normal">
                                <div class="fs-1">😐</div>
                                <div class="small">عادي</div>
                            </label>
                            
                            <input type="radio" class="btn-check" name="mood" id="mood-sad" value="sad">
                            <label class="btn btn-outline-light text-dark border p-3 rounded shadow-sm" for="mood-sad">
                                <div class="fs-1">😢</div>
                                <div class="small">حزين</div>
                            </label>
                            
                             <input type="radio" class="btn-check" name="mood" id="mood-tired" value="tired">
                            <label class="btn btn-outline-light text-dark border p-3 rounded shadow-sm" for="mood-tired">
                                <div class="fs-1">😴</div>
                                <div class="small">نعسان</div>
                            </label>
                            
                            <input type="radio" class="btn-check" name="mood" id="mood-sick" value="sick">
                            <label class="btn btn-outline-light text-dark border p-3 rounded shadow-sm" for="mood-sick">
                                <div class="fs-1">🤒</div>
                                <div class="small">مريض</div>
                            </label>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">ملاحظات صحية</label>
                        <textarea class="form-control" name="health_notes" rows="2" placeholder="أي أعراض أو ملاحظات صحية..."></textarea>
                    </div>
                </div>
            </div>
            
            <!-- Meals -->
            <div class="card mb-4">
                <div class="card-header bg-light">
                     <h5 class="mb-0"><i class="bi bi-egg-fried me-2"></i>الوجبات</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">الفطور</label>
                            <select class="form-select" name="breakfast">
                                <option value="all">أكل كل شيء</option>
                                <option value="most">أكل المعظم</option>
                                <option value="some">أكل القليل</option>
                                <option value="none">لم يأكل</option>
                            </select>
                        </div>
                         <div class="col-md-4">
                            <label class="form-label">الغداء</label>
                             <select class="form-select" name="lunch" selected>
                                <option value="all">أكل كل شيء</option>
                                <option value="most">أكل المعظم</option>
                                <option value="some">أكل القليل</option>
                                <option value="none">لم يأكل</option>
                            </select>
                        </div>
                         <div class="col-md-4">
                            <label class="form-label">سناك</label>
                            <select class="form-select" name="snack">
                                <option value="all">أكل كل شيء</option>
                                <option value="most">أكل المعظم</option>
                                <option value="some">أكل القليل</option>
                                <option value="none">لم يأكل</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Sleep & Potty -->
            <div class="card mb-4">
                <div class="card-header bg-light">
                     <h5 class="mb-0"><i class="bi bi-moon-stars me-2"></i>النوم والحمام</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label">مدة النوم (دقائق)</label>
                            <input type="number" class="form-control" name="sleep_duration" value="0" step="15">
                        </div>
                         <div class="col-md-6">
                            <label class="form-label">مرات الحمام</label>
                            <div class="input-group">
                                <button class="btn btn-outline-secondary" type="button" onclick="changeCount('bathroom_count', -1)">-</button>
                                <input type="number" class="form-control text-center" id="bathroom_count" name="bathroom_count" value="0" readonly>
                                <button class="btn btn-outline-secondary" type="button" onclick="changeCount('bathroom_count', 1)">+</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                         <label class="form-label">تغيير الحفاظ</label>
                         <div class="form-check form-check-inline">
                             <input class="form-check-input" type="checkbox" name="diaper_change_wet" value="1">
                             <label class="form-check-label">مبلل</label>
                         </div>
                         <div class="form-check form-check-inline">
                             <input class="form-check-input" type="checkbox" name="diaper_change_soiled" value="1">
                             <label class="form-check-label">متسخ</label>
                         </div>
                    </div>
                </div>
            </div>
            
            <!-- Activities -->
            <div class="card mb-4">
                <div class="card-header bg-light">
                     <h5 class="mb-0"><i class="bi bi-puzzle me-2"></i>الأنشطة والمهارات</h5>
                </div>
                <div class="card-body">
                     <div class="mb-3">
                        <label class="form-label">أنشطة اليوم</label>
                        <div class="row g-2">
                            <div class="col-6 col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="act_art">
                                    <label class="form-check-label" for="act_art">رسم وفنون</label>
                                </div>
                            </div>
                            <div class="col-6 col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="act_music">
                                    <label class="form-check-label" for="act_music">موسيقى</label>
                                </div>
                            </div>
                             <div class="col-6 col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="act_sport">
                                    <label class="form-check-label" for="act_sport">رياضة</label>
                                </div>
                            </div>
                             <div class="col-6 col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="act_story">
                                    <label class="form-check-label" for="act_story">قصص</label>
                                </div>
                            </div>
                        </div>
                     </div>
                     
                     <div class="mb-3">
                        <label class="form-label">ملاحظات عامة لولي الأمر</label>
                        <textarea class="form-control" name="general_notes" rows="3"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">الصور (اختياري)</label>
                        <input type="file" class="form-control" name="photos" multiple accept="image/*">
                    </div>
                </div>
            </div>
            
            <!-- Actions -->
            <div class="d-flex justify-content-end gap-2 mb-5">
                <a href="/reports" class="btn btn-outline-secondary">إلغاء</a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-send me-2"></i>إرسال التقرير
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Auth helper
    function getHeaders() {
        const token = localStorage.getItem('access_token');
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        return headers;
    }

    function changeCount(id, delta) {
        const input = document.getElementById(id);
        const val = parseInt(input.value) || 0;
        input.value = Math.max(0, val + delta);
    }
    
    document.addEventListener('DOMContentLoaded', loadChildren);

    async function loadChildren() {
        try {
            const res = await fetch('/api/supervisor/children', { headers: getHeaders() });
            if (!res.ok) return;
            
            const data = await res.json();
            const select = document.querySelector('select[name="child_id"]');
            
            if (data.children && data.children.length > 0) {
                 select.innerHTML = '<option value="">اختر الطفل...</option>' + 
                    data.children.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } else {
                 select.innerHTML = '<option value="">لا يوجد أطفال (لم يتم تعيينك كمشرف)</option>';
            }

            const urlParams = new URLSearchParams(window.location.search);
            const childId = urlParams.get('child_id');
            if (childId) select.value = childId;
            
        } catch (err) {
            console.error('Error loading children:', err);
        }
    }
    
    document.getElementById('reportForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const form = e.target;
        const fd = new FormData(form);
        
        // Construct detailed notes from UI fields that are not in API schema
        let extraNotes = [];
        
        // Mood
        const mood = fd.get('mood');
        const moodMap = { happy: 'سعيد', normal: 'عادي', sad: 'حزين', tired: 'متعب', sick: 'مريض' };
        if (mood) extraNotes.push(`المزاج: ${moodMap[mood] || mood}`);
        
        if (fd.get('health_notes')) extraNotes.push(`ملاحظات صحية: ${fd.get('health_notes')}`);
        
        // Sleep & Potty
        const sleep = fd.get('sleep_duration');
        if (sleep && parseInt(sleep) > 0) extraNotes.push(`نوم: ${sleep} دقيقة`);
        
        const bathroom = fd.get('bathroom_count');
        if (bathroom && parseInt(bathroom) > 0) extraNotes.push(`حمام: ${bathroom} مرات`);
        
        const diaperWet = fd.get('diaper_change_wet') ? 'مبلل' : '';
        const diaperSoiled = fd.get('diaper_change_soiled') ? 'متسخ' : '';
        if (diaperWet || diaperSoiled) extraNotes.push(`حفاظ: ${[diaperWet, diaperSoiled].filter(Boolean).join(', ')}`);
        
        // Meals Details (Since API only takes boolean)
        const meals = ['breakfast', 'lunch', 'snack'];
        const mealMap = { all: 'أكل كل شيء', most: 'أكل المعظم', some: 'أكل القليل', none: 'لم يأكل' };
        meals.forEach(m => {
            const val = fd.get(m); // Form value
            if (val && val !== 'none') {
                extraNotes.push(`${m === 'breakfast' ? 'فطور' : m === 'lunch' ? 'غداء' : 'سناك'}: ${mealMap[val]}`);
            }
        });

        // Activities
        let activitiesList = [];
        if (document.getElementById('act_art').checked) activitiesList.push('رسم وفنون');
        if (document.getElementById('act_music').checked) activitiesList.push('موسيقى');
        if (document.getElementById('act_sport').checked) activitiesList.push('رياضة');
        if (document.getElementById('act_story').checked) activitiesList.push('قصص');
        
        const generalNotes = fd.get('general_notes');
        const combinedNotes = (extraNotes.join(' | ') + '\n' + (generalNotes || '')).trim();

        const payload = {
            child_id: parseInt(fd.get('child_id')),
            date: fd.get('report_date'),
            arrival_time: fd.get('arrival_time'),
            leave_time: fd.get('leave_time'),
            breakfast: fd.get('breakfast') !== 'none',
            lunch: fd.get('lunch') !== 'none',
            snack: fd.get('snack') !== 'none',
            milk: false, // Not in UI
            activities: activitiesList.join(', '),
            notes: combinedNotes
        };
        
        try {
            const response = await fetch('/api/daily-reports/create', {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify(payload)
            });
            
            if (response.ok) {
                // If using a toast library: showToast('تم الحفظ', 'success');
                alert('تم إرسال التقرير بنجاح');
                window.location.href = '/reports'; // Or similar redirect
            } else {
                const err = await response.json();
                alert('خطأ: ' + (err.detail || 'فشل الإرسال'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('حدث خطأ في الاتصال');
        }
    });
</script>
{% endblock %}
