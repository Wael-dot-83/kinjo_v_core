{% extends 'base.html' %}

{% block title %}تسجيل ملاحظة نمائية{% endblock %}

{% block page_header %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center mb-4">
    <div>
        <h1 class="h2 mb-1">
            <i class="bi bi-eye me-2 text-success"></i>
            تسجيل ملاحظة نمائية
        </h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/dashboard">الرئيسية</a></li>
                <li class="breadcrumb-item"><a href="/curriculum">المنهج</a></li>
                <li class="breadcrumb-item active">تسجيل ملاحظة</li>
            </ol>
        </nav>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form id="obsForm" onsubmit="submitObservation(event)">
                    <div class="mb-3">
                        <label for="childId" class="form-label">رقم الطفل (ID)</label>
                        <input type="number" class="form-control" id="childId" required placeholder="أدخل رقم هوية النظام للطفل">
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="domain" class="form-label">مجال التعلم</label>
                            <select class="form-select" id="domain" required>
                                <option value="" selected disabled>اختر المجال...</option>
                                <option value="SOCIAL_EMOTIONAL">الاجتماعي الانفعالي</option>
                                <option value="PHYSICAL">الجسمي الحركي</option>
                                <option value="COGNITIVE">المعرفي الإدراكي</option>
                                <option value="LANGUAGE">اللغوي</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="mastery" class="form-label">مستوى الإتقان</label>
                            <select class="form-select" id="mastery">
                                <option value="" selected>-- غير محدد --</option>
                                <option value="NEEDS_SUPPORT">يحتاج دعم</option>
                                <option value="ON_TRACK">في المسار الصحيح</option>
                                <option value="EXCEEDS">يفوق التوقعات</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="observedAt" class="form-label">تاريخ الملاحظة</label>
                        <input type="datetime-local" class="form-control" id="observedAt" required>
                    </div>

                    <div class="mb-4">
                        <label for="notes" class="form-label">نص الملاحظة</label>
                        <textarea class="form-control" id="notes" rows="4" required placeholder="سجل ما لاحظته عن سلوك أو مهارة الطفل..."></textarea>
                        <div class="form-text">اكتب وصفاً موضوعياً لما قام به الطفل.</div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/curriculum" class="btn btn-outline-secondary">إلغاء</a>
                        <button type="submit" class="btn btn-success px-4">حفظ الملاحظة</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('observedAt').value = new Date().toISOString().slice(0, 16);

    async function submitObservation(e) {
        e.preventDefault();
        
        const data = {
            child_id: parseInt(document.getElementById('childId').value),
            domain: document.getElementById('domain').value,
            mastery_level: document.getElementById('mastery').value || null,
            observation_text: document.getElementById('notes').value,
            observed_at: new Date(document.getElementById('observedAt').value).toISOString()
        };

        try {
            const token = localStorage.getItem('token'); 
            const response = await fetch('/api/observations', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert('تم حفظ الملاحظة بنجاح');
                window.location.href = '/curriculum';
            } else {
                const err = await response.json();
                alert('خطأ: ' + (err.detail || 'فشل الحفظ'));
            }
        } catch (error) {
            console.error(error);
            alert('حدث خطأ في الاتصال');
        }
    }
</script>
{% endblock %}
