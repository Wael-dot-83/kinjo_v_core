{% macro export_modal(modal_id="exportModal", form_id="exportForm", spinner_id="exportSpinner", report_types=None) %}
<!-- Export Modal Component -->
<div class="modal fade" id="{{ modal_id }}" tabindex="-1" aria-labelledby="{{ modal_id }}Label" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="{{ modal_id }}Label">
                    <i class="bi bi-download"></i> تصدير البيانات
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body">
                <form id="{{ form_id }}">
                    <div class="mb-3">
                        <label class="form-label">صيغة التصدير</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="exportFormat" id="formatExcel" value="excel"
                                checked>
                            <label class="btn btn-outline-primary" for="formatExcel">
                                <i class="bi bi-file-earmark-excel"></i> Excel
                            </label>

                            <input type="radio" class="btn-check" name="exportFormat" id="formatCsv" value="csv">
                            <label class="btn btn-outline-primary" for="formatCsv">
                                <i class="bi bi-file-earmark-text"></i> CSV
                            </label>

                            <input type="radio" class="btn-check" name="exportFormat" id="formatPdf" value="pdf">
                            <label class="btn btn-outline-primary" for="formatPdf">
                                <i class="bi bi-file-earmark-pdf"></i> PDF
                            </label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">نطاق البيانات</label>
                        <select class="form-select" id="exportRange">
                            <option value="current">الصفحة الحالية</option>
                            <option value="all">جميع البيانات</option>
                            <option value="filtered">البيانات المفلترة</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">الأعمدة المراد تصديرها</label>
                        <div id="exportColumns" class="border rounded p-2" style="max-height: 200px; overflow-y: auto;">
                            <!-- Columns will be populated dynamically -->
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="colAll" checked>
                                <label class="form-check-label" for="colAll">تحديد الكل</label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary" id="confirmExport">
                    <i class="bi bi-download"></i> تصدير
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // Export functionality
    document.getElementById('confirmExport')?.addEventListener('click', function () {
        const format = document.querySelector('input[name="exportFormat"]:checked').value;
        const range = document.getElementById('exportRange').value;

        // Trigger export event
        const event = new CustomEvent('exportData', {
            detail: { format, range }
        });
        document.dispatchEvent(event);

        // Close modal
        bootstrap.Modal.getInstance(document.getElementById('{{ modal_id }}')).hide();
    });

    // Select all columns toggle
    document.getElementById('colAll')?.addEventListener('change', function () {
        const checkboxes = document.querySelectorAll('#exportColumns input[type="checkbox"]:not(#colAll)');
        checkboxes.forEach(cb => cb.checked = this.checked);
    });
</script>
{% endmacro %}
