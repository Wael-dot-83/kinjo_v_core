{# templates/components/kpi-card.html #}
{% macro kpi_card(id, label, value_id, icon, color='primary', delta_id=None, sparkline_id=None) %}
<div class="k-card k-kpi-card k-bg-{{ color }} k-text-inverse" id="{{ id }}">
  <div class="k-flex k-justify-between k-items-center k-mb-2">
    <div class="k-text-muted k-text-inverse" style="opacity: 0.8; font-size: var(--kinjo-font-size-sm);">
      {{ label }}
    </div>
    <div class="k-kpi-icon">
      <i class="bi bi-{{ icon }}" aria-hidden="true"></i>
    </div>
  </div>
  <div class="k-flex k-items-center k-justify-between">
    <h3 class="k-kpi-value k-mb-0" id="{{ value_id }}" aria-live="polite">
      <span class="spinner-border spinner-border-sm k-kpi-loading" role="status" aria-hidden="true"></span>
    </h3>
    {% if delta_id %}
    <span class="k-badge k-kpi-delta" id="{{ delta_id }}"></span>
    {% endif %}
  </div>
  {% if sparkline_id %}
  <div class="k-kpi-sparkline k-mt-4" id="{{ sparkline_id }}" style="height: 40px;"></div>
  {% endif %}
</div>
{% endmacro %}
