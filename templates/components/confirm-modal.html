{% macro modal_footer(confirm_text="تأكيد", cancel_text="إلغاء", confirm_color="primary", cancel_color="secondary") %}
<div class="modal-footer">
    <button type="button" class="btn btn-{{ cancel_color }}" data-bs-dismiss="modal">{{ cancel_text }}</button>
    <button type="button" class="btn btn-{{ confirm_color }}" onclick="confirmAction()">{{ confirm_text }}</button>
</div>
{% endmacro %}
