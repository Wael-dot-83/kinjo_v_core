{# templates/components/data-table.html #}
{% macro data_table(id, columns) %}
<div class="k-card k-table-container k-mb-4" id="{{ id }}-container">
  <div class="table-responsive">
    <table class="k-table" id="{{ id }}">
      <thead>
        <tr>
          {% for col in columns %}
          <th scope="col" {% if col.sortable %}class="sortable" data-sort="{{ col.key }}"{% endif %}>
            {{ col.label }}
          </th>
          {% endfor %}
        </tr>
      </thead>
      <tbody id="{{ id }}-body">
        <tr>
          <td colspan="{{ columns|length }}" class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">{% if ui_lang == 'en' %}Loading...{% else %}جار التحميل...{% endif %}</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="k-flex k-justify-between k-items-center k-mt-4 k-px-4 k-pb-4" id="{{ id }}-pagination">
    <div class="k-text-muted text-sm">
      <span id="{{ id }}-count">0</span> {% if ui_lang == 'en' %}results{% else %}نتيجة{% endif %}
    </div>
    <div class="btn-group">
      <button type="button" class="k-btn k-btn-outline k-btn-prev" disabled>
        <i class="bi bi-chevron-{% if ui_dir == 'rtl' %}right{% else %}left{% endif %}"></i>
      </button>
      <button type="button" class="k-btn k-btn-outline k-btn-next" disabled>
        <i class="bi bi-chevron-{% if ui_dir == 'rtl' %}left{% else %}right{% endif %}"></i>
      </button>
    </div>
  </div>
</div>
{% endmacro %}
