{% macro step_indicator(steps, current_step) %}
<div class="step-indicator mb-4">
    <div class="d-flex justify-content-center">
        {% for step in steps %}
        <div
            class="step-item{% if step.number < current_step %} completed{% elif step.number == current_step %} active{% endif %}">
            <div class="step-circle">
                {% if step.number < current_step %} <i class="bi bi-check"></i>
                    {% else %}
                    {{ step.number }}
                    {% endif %}
            </div>
            <div class="step-label">{{ step.label }}</div>
        </div>
        {% if not loop.last %}
        <div class="step-connector{% if step.number < current_step %} completed{% endif %}"></div>
        {% endif %}
        {% endfor %}
    </div>
</div>

<style>
    .step-indicator {
        margin: 2rem 0;
    }

    .step-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }

    .step-circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: #e9ecef;
        color: #6c757d;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        margin-bottom: 0.5rem;
        transition: all 0.3s ease;
    }

    .step-item.active .step-circle {
        background-color: #0d6efd;
        color: white;
    }

    .step-item.completed .step-circle {
        background-color: #198754;
        color: white;
    }

    .step-label {
        font-size: 0.875rem;
        color: #6c757d;
        text-align: center;
        max-width: 100px;
    }

    .step-item.active .step-label {
        color: #0d6efd;
        font-weight: 500;
    }

    .step-item.completed .step-label {
        color: #198754;
    }

    .step-connector {
        width: 60px;
        height: 2px;
        background-color: #e9ecef;
        margin: 0 1rem;
        align-self: center;
    }

    .step-connector.completed {
        background-color: #198754;
    }

    @media (max-width: 768px) {
        .step-connector {
            width: 30px;
            margin: 0 0.5rem;
        }

        .step-label {
            font-size: 0.75rem;
            max-width: 80px;
        }
    }
</style>
{% endmacro %}
