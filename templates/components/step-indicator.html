{% macro step_indicator(steps, current_step) %}
<div class="step-indicator mb-4">
    <div class="d-flex justify-content-center">
        {% for step in steps %}
        <div
            class="step-item{% if step.number < current_step %} completed{% elif step.number == current_step %} active{% endif %}">
            <div class="step-circle">
                {% if step.number < current_step %} <i class="bi bi-check"></i>
                    {% else %}
                    {{ step.number }}
                    {% endif %}
            </div>
            <div class="step-label">{{ step.label }}</div>
        </div>
        {% if not loop.last %}
        <div class="step-connector{% if step.number < current_step %} completed{% endif %}"></div>
        {% endif %}
        {% endfor %}
    </div>
</div>

<style>
    .step-indicator {
        margin: 2rem 0;
    }

    .step-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }

    .step-circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        /* --kinjo-border-color belongs to kinjo.css's parallel token namespace and
           resolves to the brand green here, so the inactive step rendered slate
           text on dark green at 2.06:1 -- effectively unreadable. Canonical
           tokens give the intended light chip at 6.15:1. */
        background-color: var(--kinjo-color-bg-active);
        color: var(--kinjo-color-text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        margin-bottom: 0.5rem;
        transition: background-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    .step-item.active .step-circle {
        background-color: var(--kinjo-primary, var(--kinjo-brand));
        color: #fff;
    }

    .step-item.completed .step-circle {
        background-color: var(--kinjo-success, #10b981);
        color: #fff;
    }

    .step-label {
        font-size: 0.875rem;
        /* The #94a3b8 fallback is 2.6:1 on white -- it only ever reads as
           "muted" because it is barely there. This is the label under an
           unvisited step, which the user needs in order to see where the flow
           is going, so it gets the accessible neutral instead. */
        color: var(--kinjo-color-neutral-text);
        text-align: center;
        max-width: 100px;
        transition: color 0.2s ease;
    }

    .step-item.active .step-label {
        color: var(--kinjo-primary, var(--kinjo-brand));
        font-weight: 600;
    }

    .step-item.completed .step-label {
        color: var(--kinjo-success, #10b981);
    }

    .step-connector {
        width: 60px;
        height: 2px;
        background-color: var(--kinjo-border-color, #e2e8f0);
        margin: 0 1rem;
        align-self: center;
        transition: background-color 0.3s ease;
    }

    .step-connector.completed {
        background-color: var(--kinjo-success, #10b981);
    }

    @media (max-width: 768px) {
        .step-connector {
            width: 30px;
            margin: 0 0.5rem;
        }

        .step-label {
            font-size: 0.75rem;
            max-width: 80px;
        }
    }
</style>
{% endmacro %}
