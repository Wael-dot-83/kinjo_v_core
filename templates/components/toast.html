{# templates/components/toast.html #}
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100" id="toast-container">
  <!-- Toasts will be injected here via JavaScript -->
</div>

<template id="toast-template">
  <div class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body k-toast-message"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="{{ _t('close', 'Close') }}"></button>
    </div>
  </div>
</template>
