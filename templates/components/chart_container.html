{% macro chart_container(title, chart_id, height='300px', tooltip='') %}
<div class="chart-container card border-0 shadow-sm">
    <div class="card-header bg-white border-0 pb-0">
        <div class="d-flex align-items-center justify-content-between">
            <h6 class="mb-0 fw-bold text-dark">{{ title }}</h6>
            {% if tooltip %}
            <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip" title="{{ tooltip }}"></i>
            {% endif %}
        </div>
    </div>
    <div class="card-body">
        <div class="position-relative" style="height: {{ height }};">
            <canvas id="{{ chart_id }}" width="100%" height="100%"></canvas>
            <div
                class="skeleton-container position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center d-none">
                <div class="skeleton-text w-75"></div>
                <div class="skeleton-text w-50 mt-2"></div>
                <div class="skeleton-text w-25 mt-2"></div>
            </div>
        </div>
    </div>
</div>
{% endmacro %}
