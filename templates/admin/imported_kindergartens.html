{% extends "base.html" %}

{% block title %}Imported Kindergartens{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="card-title mb-0">Imported Kindergartens</h3>
                    <a href="/admin/import-kindergartens" class="btn btn-primary">
                        <i class="fas fa-upload"></i> Import More
                    </a>
                </div>
                <div class="card-body">
                    <!-- Filters -->
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <input type="text" class="form-control" id="searchInput"
                                placeholder="Search by name or phone">
                        </div>
                        <div class="col-md-3">
                            <select class="form-control" id="governorateFilter">
                                <option value="">All Governorates</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-control" id="cityFilter">
                                <option value="">All Cities</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-secondary" id="clearFilters">Clear Filters</button>
                        </div>
                    </div>

                    <!-- Results info -->
                    <div class="mb-3">
                        <small class="text-muted" id="resultsInfo">Loading...</small>
                    </div>

                    <!-- Table -->
                    <div class="table-responsive">
                        <table class="table table-striped table-hover" id="kindergartensTable">
                            <thead>
                                <tr>
                                    <th>Name (AR)</th>
                                    <th>Name (EN)</th>
                                    <th>Governorate</th>
                                    <th>City</th>
                                    <th>Area</th>
                                    <th>Phone</th>
                                    <th>Address</th>
                                    <th>Imported At</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="8" class="text-center">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav aria-label="Pagination" id="paginationNav" style="display: none;">
                        <ul class="pagination justify-content-center" id="pagination">
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentPage = 1;
    let currentFilters = {
        search: '',
        governorate: '',
        city: ''
    };

    async function loadKindergartens(page = 1) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '<tr><td colspan="8" class="text-center">Loading...</td></tr>';

        const params = new URLSearchParams({
            page: page,
            per_page: 50,
            ...currentFilters
        });

        try {
            const response = await fetch(`/api/admin/kindergartens/imported?${params}`);
            const data = await response.json();

            if (!response.ok) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Error loading data</td></tr>';
                return;
            }

            // Update results info
            document.getElementById('resultsInfo').textContent =
                `Showing ${data.kindergartens.length} of ${data.total} kindergartens`;

            // Update table
            if (data.kindergartens.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">No kindergartens found</td></tr>';
            } else {
                tbody.innerHTML = data.kindergartens.map(kg => `
                <tr>
                    <td>${kg.name_ar}</td>
                    <td>${kg.name_en || ''}</td>
                    <td>${kg.governorate}</td>
                    <td>${kg.city}</td>
                    <td>${kg.area || ''}</td>
                    <td>${kg.phone}</td>
                    <td>${kg.detailed_address || ''}</td>
                    <td>${new Date(kg.created_at).toLocaleDateString()}</td>
                </tr>
            `).join('');
            }

            // Update pagination
            updatePagination(data.page, data.pages);

        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Error loading data</td></tr>';
        }
    }

    function updatePagination(currentPage, totalPages) {
        const pagination = document.getElementById('pagination');
        const nav = document.getElementById('paginationNav');

        if (totalPages <= 1) {
            nav.style.display = 'none';
            return;
        }

        nav.style.display = 'block';
        pagination.innerHTML = '';

        // Previous button
        if (currentPage > 1) {
            pagination.innerHTML += `<li class="page-item"><a class="page-link" href="#" onclick="loadKindergartens(${currentPage - 1})">Previous</a></li>`;
        }

        // Page numbers
        for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
            pagination.innerHTML += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="loadKindergartens(${i})">${i}</a></li>`;
        }

        // Next button
        if (currentPage < totalPages) {
            pagination.innerHTML += `<li class="page-item"><a class="page-link" href="#" onclick="loadKindergartens(${currentPage + 1})">Next</a></li>`;
        }
    }

    function applyFilters() {
        currentFilters.search = document.getElementById('searchInput').value;
        currentFilters.governorate = document.getElementById('governorateFilter').value;
        currentFilters.city = document.getElementById('cityFilter').value;
        loadKindergartens(1);
    }

    function clearFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('governorateFilter').value = '';
        document.getElementById('cityFilter').value = '';
        currentFilters = { search: '', governorate: '', city: '' };
        loadKindergartens(1);
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('governorateFilter').addEventListener('change', applyFilters);
    document.getElementById('cityFilter').addEventListener('change', applyFilters);
    document.getElementById('clearFilters').addEventListener('click', clearFilters);

    // Load initial data
    loadKindergartens();
</script>
{% endblock %}
