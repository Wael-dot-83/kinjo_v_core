{% extends 'base.html' %}
{% block title %}المهام — KinJo{% endblock %}

{% block page_header %}
<div class="page-header-wrap">
    <div>
        <div class="page-header-eyebrow">
            <i class="bi bi-check2-square"></i>
            إدارة المهام
        </div>
        <h1 class="page-header-title">قائمة المهام</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0" style="font-size:0.82rem;">
                <li class="breadcrumb-item"><a href="/dashboard" class="text-decoration-none">لوحة التحكم</a></li>
                <li class="breadcrumb-item active">المهام</li>
            </ol>
        </nav>
    </div>
    <div class="page-header-actions">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal">
            <i class="bi bi-plus-circle me-2"></i>مهمة جديدة
        </button>
    </div>
</div>
{% endblock %}

{% block content %}

<!-- Status Tabs -->
<div class="enroll-tabs-wrap mb-4">
    <div class="enroll-tabs" id="statusTabs">
        <button class="enroll-tab active" data-filter="" type="button">
            <i class="bi bi-grid-3x3-gap-fill"></i>الكل
            <span class="enroll-tab-badge" id="countAll">0</span>
        </button>
        <button class="enroll-tab" data-filter="pending" type="button">
            <i class="bi bi-hourglass-split"></i>قيد الانتظار
            <span class="enroll-tab-badge warning" id="countPending">0</span>
        </button>
        <button class="enroll-tab" data-filter="in_progress" type="button">
            <i class="bi bi-arrow-repeat"></i>قيد التنفيذ
            <span class="enroll-tab-badge info" id="countProgress">0</span>
        </button>
        <button class="enroll-tab" data-filter="completed" type="button">
            <i class="bi bi-check-circle-fill"></i>مكتملة
            <span class="enroll-tab-badge success" id="countCompleted">0</span>
        </button>
    </div>
</div>

<!-- Filter Bar -->
<div class="filter-bar card mb-4">
    <div class="card-body py-3">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="filter-label">الأولوية</label>
                <select class="form-select form-select-sm" id="priorityFilter">
                    <option value="">جميع الأولويات</option>
                    <option value="urgent">عاجل</option>
                    <option value="high">عالٍ</option>
                    <option value="medium">متوسط</option>
                    <option value="low">منخفض</option>
                </select>
            </div>
            <div class="col-md-3">
                <div class="d-flex flex-column gap-1 mt-1">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="assignedToMeFilter">
                        <label class="form-check-label small fw-600" for="assignedToMeFilter">المهام المسندة لي</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="createdByMeFilter">
                        <label class="form-check-label small fw-600" for="createdByMeFilter">المهام التي أنشأتها</label>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary btn-sm w-100" onclick="loadTasks()">
                    <i class="bi bi-funnel-fill me-2"></i>تطبيق الفلاتر
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Tasks Grid -->
<div class="row g-3" id="tasksContainer">
    <!-- Skeleton cards -->
    <div class="col-md-6 col-lg-4 task-skeleton-col">
        <div class="card task-skeleton-card">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between mb-3">
                    <div class="skeleton" style="width:55%;height:16px;border-radius:6px;"></div>
                    <div class="skeleton" style="width:20%;height:20px;border-radius:50px;"></div>
                </div>
                <div class="skeleton mb-2" style="width:80%;height:12px;border-radius:5px;"></div>
                <div class="skeleton mb-4" style="width:60%;height:12px;border-radius:5px;"></div>
                <div class="skeleton" style="height:36px;border-radius:10px;"></div>
            </div>
        </div>
    </div>
    <div class="col-md-6 col-lg-4 task-skeleton-col">
        <div class="card task-skeleton-card">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between mb-3">
                    <div class="skeleton" style="width:60%;height:16px;border-radius:6px;"></div>
                    <div class="skeleton" style="width:18%;height:20px;border-radius:50px;"></div>
                </div>
                <div class="skeleton mb-2" style="width:75%;height:12px;border-radius:5px;"></div>
                <div class="skeleton mb-4" style="width:50%;height:12px;border-radius:5px;"></div>
                <div class="skeleton" style="height:36px;border-radius:10px;"></div>
            </div>
        </div>
    </div>
    <div class="col-md-6 col-lg-4 task-skeleton-col">
        <div class="card task-skeleton-card">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between mb-3">
                    <div class="skeleton" style="width:50%;height:16px;border-radius:6px;"></div>
                    <div class="skeleton" style="width:22%;height:20px;border-radius:50px;"></div>
                </div>
                <div class="skeleton mb-2" style="width:85%;height:12px;border-radius:5px;"></div>
                <div class="skeleton mb-4" style="width:45%;height:12px;border-radius:5px;"></div>
                <div class="skeleton" style="height:36px;border-radius:10px;"></div>
            </div>
        </div>
    </div>
</div>

<!-- Task Create/Edit Modal -->
<div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-800" id="taskModalTitle">
                    <i class="bi bi-plus-circle me-2 text-primary"></i>
                    مهمة جديدة
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body">
                <form id="taskForm">
                    <input type="hidden" id="taskId">

                    <div class="mb-3">
                        <label for="taskTitle" class="form-label fw-700" style="font-size:0.85rem;">
                            العنوان <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="taskTitle"
                               placeholder="أدخل عنوان المهمة..." required maxlength="255">
                    </div>

                    <div class="mb-3">
                        <label for="taskDescription" class="form-label fw-700" style="font-size:0.85rem;">الوصف</label>
                        <textarea class="form-control" id="taskDescription" rows="3"
                                  placeholder="وصف تفصيلي للمهمة (اختياري)..."></textarea>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label for="taskPriority" class="form-label fw-700" style="font-size:0.85rem;">الأولوية</label>
                            <select class="form-select" id="taskPriority">
                                <option value="low">منخفض</option>
                                <option value="medium" selected>متوسط</option>
                                <option value="high">عالٍ</option>
                                <option value="urgent">عاجل</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label for="taskDueDate" class="form-label fw-700" style="font-size:0.85rem;">تاريخ الاستحقاق</label>
                            <input type="datetime-local" class="form-control" id="taskDueDate">
                        </div>
                    </div>

                    <div class="mb-0">
                        <label for="taskAssignedTo" class="form-label fw-700" style="font-size:0.85rem;">
                            تعيين إلى <span class="text-muted fw-normal">(اختياري)</span>
                        </label>
                        <input type="number" class="form-control" id="taskAssignedTo"
                               placeholder="معرف المستخدم — اتركه فارغاً لتعيينه لنفسك">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary" onclick="saveTask()">
                    <i class="bi bi-check-lg me-2"></i>حفظ المهمة
                </button>
            </div>
        </div>
    </div>
</div>

<style>
.page-header-wrap { display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem; }
.page-header-eyebrow { display:inline-flex;align-items:center;gap:0.4rem;font-size:0.78rem;font-weight:700;color:var(--kinjo-primary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.25rem; }
.page-header-title { font-size:1.5rem;font-weight:800;margin:0 0 0.25rem;color:var(--kinjo-text-primary); }
.page-header-actions { display:flex;align-items:center;gap:0.5rem;flex-shrink:0; }

/* Tabs (shared) */
.enroll-tabs-wrap { overflow-x:auto; }
.enroll-tabs { display:inline-flex;gap:0.375rem;background:var(--kinjo-surface);border-radius:var(--kinjo-radius-xl);padding:0.3rem;border:1px solid var(--kinjo-border);white-space:nowrap; }
.enroll-tab { display:inline-flex;align-items:center;gap:0.5rem;padding:0.45rem 1rem;border-radius:var(--kinjo-radius-lg);font-size:0.84rem;font-weight:600;border:none;background:transparent;color:var(--kinjo-text-muted);transition:all 0.2s;cursor:pointer; }
.enroll-tab:hover { color:var(--kinjo-text-primary);background:var(--kinjo-card-bg); }
.enroll-tab.active { background:var(--kinjo-card-bg);color:var(--kinjo-primary);box-shadow:var(--kinjo-shadow-sm); }
.enroll-tab-badge { min-width:22px;height:20px;border-radius:50px;font-size:0.7rem;font-weight:800;padding:0 0.4rem;display:inline-flex;align-items:center;justify-content:center;background:var(--kinjo-border);color:var(--kinjo-text-muted); }
.enroll-tab-badge.warning { background:rgba(245,158,11,0.2);color:#d97706; }
.enroll-tab-badge.success { background:rgba(16,185,129,0.2);color:var(--kinjo-success); }
.enroll-tab-badge.info    { background:rgba(6,182,212,0.2);color:#0891b2; }

/* Filter bar */
.filter-bar { border-color:var(--kinjo-border); }
.filter-label { font-size:0.8rem;font-weight:700;color:var(--kinjo-text-muted);display:block;margin-bottom:0.35rem; }

/* Task cards */
.task-card {
    border:1px solid var(--kinjo-border);
    border-radius:var(--kinjo-radius-xl);
    background:var(--kinjo-card-bg);
    transition:all 0.25s;
    overflow:hidden;
}
.task-card:hover { transform:translateY(-3px);box-shadow:var(--kinjo-shadow-lg);border-color:var(--kinjo-primary-light); }
.task-card.completed { opacity:0.7; }
.task-card.completed:hover { opacity:1; }

/* Priority accent bar */
.task-priority-bar { height:4px; width:100%; }
.task-priority-bar.urgent { background:var(--kinjo-danger); }
.task-priority-bar.high   { background:#f97316; }
.task-priority-bar.medium { background:var(--kinjo-primary); }
.task-priority-bar.low    { background:#64748b; }

/* Priority badge */
.priority-badge { display:inline-flex;align-items:center;gap:0.3rem;padding:0.2rem 0.6rem;border-radius:50px;font-size:0.72rem;font-weight:700; }
.priority-badge.urgent { background:rgba(239,68,68,0.15);color:var(--kinjo-danger); }
.priority-badge.high   { background:rgba(249,115,22,0.15);color:#ea580c; }
.priority-badge.medium { background:var(--kinjo-primary-xlight);color:var(--kinjo-primary); }
.priority-badge.low    { background:rgba(100,116,139,0.12);color:#64748b; }

/* Status badge inside card */
.task-status-badge { display:inline-flex;align-items:center;gap:0.3rem;padding:0.2rem 0.6rem;border-radius:50px;font-size:0.72rem;font-weight:700; }
.task-status-badge.PENDING     { background:rgba(245,158,11,0.15);color:#d97706; }
.task-status-badge.IN_PROGRESS { background:rgba(6,182,212,0.15);color:#0891b2; }
.task-status-badge.COMPLETED   { background:rgba(16,185,129,0.15);color:var(--kinjo-success); }
.task-status-badge.CANCELLED   { background:rgba(100,116,139,0.12);color:#64748b; }

/* Skeleton */
.skeleton { background:var(--kinjo-skeleton-base,#e2e8f0);animation:shimmer 1.5s infinite; }
@keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:0.5} }
</style>
{% endblock %}

{% block extra_js %}
<script>
let tasks = [];
let currentFilter = '';
let currentPriority = '';

document.addEventListener('DOMContentLoaded', async () => {
    await loadTasks();
    setupTabHandlers();
    document.getElementById('taskModal').addEventListener('hidden.bs.modal', resetForm);
});

function authHeaders() {
    const t = localStorage.getItem('access_token') || localStorage.getItem('token');
    const h = { 'Content-Type': 'application/json' };
    if (t) h['Authorization'] = `Bearer ${t}`;
    return h;
}

async function loadTasks() {
    try {
        const params = new URLSearchParams();
        if (currentFilter)  params.set('status_filter',  currentFilter);
        if (currentPriority) params.set('priority_filter', currentPriority);
        if (document.getElementById('assignedToMeFilter').checked) params.set('assigned_to_me', 'true');
        if (document.getElementById('createdByMeFilter').checked)  params.set('created_by_me', 'true');

        const r = await fetch(`/tasks?${params}`, { headers: authHeaders() });
        if (!r.ok) throw new Error();
        tasks = await r.json();

        document.querySelectorAll('.task-skeleton-col').forEach(el => el.remove());
        updateCounts(tasks);
        renderTasks(tasks);

    } catch {
        document.querySelectorAll('.task-skeleton-col').forEach(el => el.remove());
        showToast('حدث خطأ في تحميل المهام', 'error');
        document.getElementById('tasksContainer').innerHTML = `
            <div class="col-12 text-center py-5 text-muted">
                <i class="bi bi-exclamation-circle d-block fs-1 mb-2 opacity-25"></i>
                <p>تعذّر تحميل المهام</p>
            </div>`;
    }
}

function updateCounts(data) {
    document.getElementById('countAll').textContent       = data.length;
    document.getElementById('countPending').textContent   = data.filter(t => t.status === 'PENDING').length;
    document.getElementById('countProgress').textContent  = data.filter(t => t.status === 'IN_PROGRESS').length;
    document.getElementById('countCompleted').textContent = data.filter(t => t.status === 'COMPLETED').length;
}

function renderTasks(data) {
    const c = document.getElementById('tasksContainer');
    if (!data.length) {
        c.innerHTML = `
            <div class="col-12 text-center py-5">
                <div class="empty-state-center">
                    <div class="empty-state-icon"><i class="bi bi-check2-all"></i></div>
                    <h6 class="fw-700 mt-3 mb-1">لا توجد مهام</h6>
                    <p class="text-muted small mb-3">أنشئ مهمة جديدة لبدء العمل</p>
                    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#taskModal">
                        <i class="bi bi-plus-circle me-2"></i>مهمة جديدة
                    </button>
                </div>
            </div>`;
        return;
    }

    const priorityOrder = { URGENT:0, HIGH:1, MEDIUM:2, LOW:3 };
    const sorted = [...data].sort((a,b) => (priorityOrder[a.priority] || 99) - (priorityOrder[b.priority] || 99));

    c.innerHTML = sorted.map(task => {
        const isCompleted = task.status === 'COMPLETED';
        const pri = (task.priority || '').toLowerCase();
        return `
        <div class="col-md-6 col-lg-4">
            <div class="task-card${isCompleted ? ' completed' : ''}">
                <div class="task-priority-bar ${pri}"></div>
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start mb-2 gap-2">
                        <h6 class="fw-800 mb-0 ${isCompleted ? 'text-decoration-line-through text-muted' : ''}"
                            style="font-size:0.95rem;line-height:1.4;">${task.title}</h6>
                        ${priorityBadge(task.priority)}
                    </div>

                    ${task.description ? `<p class="text-muted small mb-3 lh-base">${task.description}</p>` : ''}

                    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                        ${statusBadge(task.status)}
                        ${task.due_date ? `
                            <span style="font-size:0.75rem;color:var(--kinjo-text-muted);">
                                <i class="bi bi-calendar-event me-1"></i>${formatDate(task.due_date)}
                            </span>` : ''}
                    </div>

                    <div class="d-flex gap-2">
                        <button class="btn btn-primary btn-sm flex-grow-1"
                                onclick="toggleTaskStatus(${task.id}, '${task.status}')">
                            <i class="bi bi-${isCompleted ? 'arrow-counterclockwise' : 'check-circle'} me-1"></i>
                            ${isCompleted ? 'إعادة فتح' : 'إكمال'}
                        </button>
                        <button class="btn btn-ghost btn-sm px-2" onclick="editTask(${task.id})" title="تعديل">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-ghost btn-sm px-2" onclick="deleteTask(${task.id})" title="حذف"
                                style="color:var(--kinjo-danger);">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
                <div class="card-footer bg-transparent" style="font-size:0.75rem;color:var(--kinjo-text-muted);padding:0.6rem 1rem;">
                    <i class="bi bi-clock me-1"></i>تم الإنشاء: ${formatDate(task.created_at)}
                </div>
            </div>
        </div>`;
    }).join('');
}

function priorityBadge(p) {
    const map = {
        URGENT: ['urgent','عاجل'],
        HIGH:   ['high','عالٍ'],
        MEDIUM: ['medium','متوسط'],
        LOW:    ['low','منخفض']
    };
    const [cls, label] = map[p] || ['low','—'];
    return `<span class="priority-badge ${cls}">${label}</span>`;
}

function statusBadge(s) {
    const map = {
        PENDING:     ['hourglass-split', 'قيد الانتظار'],
        IN_PROGRESS: ['arrow-repeat',    'قيد التنفيذ'],
        COMPLETED:   ['check-circle-fill','مكتملة'],
        CANCELLED:   ['x-circle-fill',   'ملغاة']
    };
    const [icon, label] = map[s] || ['question-circle','غير محدد'];
    return `<span class="task-status-badge ${s}"><i class="bi bi-${icon}"></i>${label}</span>`;
}

function setupTabHandlers() {
    document.querySelectorAll('.enroll-tab').forEach(tab => {
        tab.addEventListener('click', async () => {
            document.querySelectorAll('.enroll-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentFilter = tab.dataset.filter;
            await loadTasks();
        });
    });
    document.getElementById('priorityFilter').addEventListener('change', e => { currentPriority = e.target.value; });
}

async function saveTask() {
    const id = document.getElementById('taskId').value;
    const data = {
        title:          document.getElementById('taskTitle').value.trim(),
        description:    document.getElementById('taskDescription').value.trim(),
        priority:       document.getElementById('taskPriority').value,
        due_date:       document.getElementById('taskDueDate').value || null,
        assigned_to_id: document.getElementById('taskAssignedTo').value || null
    };
    if (!data.title) { showToast('يرجى إدخال عنوان المهمة', 'warning'); return; }

    try {
        const r = await fetch(id ? `/tasks/${id}` : '/tasks', {
            method: id ? 'PUT' : 'POST',
            headers: authHeaders(),
            body: JSON.stringify(data)
        });
        if (!r.ok) throw new Error();
        bootstrap.Modal.getInstance(document.getElementById('taskModal')).hide();
        showToast('تم حفظ المهمة بنجاح', 'success');
        await loadTasks();
    } catch {
        showToast('حدث خطأ في حفظ المهمة', 'error');
    }
}

async function toggleTaskStatus(id, currentStatus) {
    try {
        const r = await fetch(`/tasks/${id}/toggle`, { method:'POST', headers: authHeaders() });
        if (!r.ok) throw new Error();
        showToast(currentStatus === 'COMPLETED' ? 'تم إعادة فتح المهمة' : 'تم إكمال المهمة', 'success');
        await loadTasks();
    } catch {
        showToast('حدث خطأ في تحديث المهمة', 'error');
    }
}

function editTask(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    document.getElementById('taskModalTitle').innerHTML = '<i class="bi bi-pencil me-2 text-primary"></i>تعديل المهمة';
    document.getElementById('taskId').value          = t.id;
    document.getElementById('taskTitle').value       = t.title;
    document.getElementById('taskDescription').value = t.description || '';
    document.getElementById('taskPriority').value    = (t.priority || 'medium').toLowerCase();
    document.getElementById('taskDueDate').value     = t.due_date ? t.due_date.slice(0,16) : '';
    document.getElementById('taskAssignedTo').value  = t.assigned_to_id || '';
    new bootstrap.Modal(document.getElementById('taskModal')).show();
}

async function deleteTask(id) {
    if (!confirm('هل أنت متأكد من حذف هذه المهمة؟')) return;
    try {
        const r = await fetch(`/tasks/${id}`, { method:'DELETE', headers: authHeaders() });
        if (!r.ok) throw new Error();
        showToast('تم حذف المهمة', 'success');
        await loadTasks();
    } catch {
        showToast('حدث خطأ في حذف المهمة', 'error');
    }
}

function resetForm() {
    document.getElementById('taskModalTitle').innerHTML = '<i class="bi bi-plus-circle me-2 text-primary"></i>مهمة جديدة';
    document.getElementById('taskForm').reset();
    document.getElementById('taskId').value = '';
}

function formatDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleDateString('ar-SA', { year:'numeric', month:'short', day:'numeric' });
}
</script>
{% endblock %}
