<!DOCTYPE html>
<html lang="{{ ui_lang | default('ar') }}" dir="{{ ui_dir | default('rtl') }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="{% if ui_lang == 'en' %}KinJo Admin - Professional Kindergarten Management System{% else %}KinJo - إدارة احترافية لرياض الأطفال{% endif %}">
    <meta name="author" content="KinJo Team">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="{% if ui_lang == 'en' %}en_US{% else %}ar_JO{% endif %}">
    <meta property="og:site_name" content="KinJo Admin">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Admin Design System CSS -->
    <link rel="stylesheet" href="/static/css/admin_design_system.css">
    <script src="/static/js/sanitize.js"></script>
    <script src="/static/js/page_load_timer.js"></script>

    <!-- Bootstrap CSS (direction-aware on initial SSR) -->
    <link id="bootstrapCss"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/{% if ui_dir == 'ltr' %}bootstrap.min.css{% else %}bootstrap.rtl.min.css{% endif %}"
        data-rtl-href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
        data-ltr-href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>{% block title %}{% if ui_lang == 'en' %}KinJo Admin{% else %}إدارة كينجو{% endif %}{% endblock %}</title>

    {% block extra_head %}{% endblock %}
</head>

<body class="admin-container">
    <div class="admin-layout" id="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="admin-sidebar-header">
                <a href="/admin" class="admin-sidebar-logo">
                    <i class="fas fa-child"></i>
                    <span data-i18n="nav.brand">KinJo</span>
                </a>
            </div>

            <nav class="admin-sidebar-nav">
                <!-- Dashboard -->
                <a href="/admin" class="admin-nav-item {% if request.url.path == '/admin' %}active{% endif %}"
                    data-nav="dashboard">
                    <i class="fas fa-tachometer-alt admin-nav-icon"></i>
                    <span class="admin-nav-text" data-i18n="nav.dashboard">Dashboard</span>
                </a>

                <!-- User Management -->
                <a href="/admin/users"
                    class="admin-nav-item {% if request.url.path.startswith('/admin/users') %}active{% endif %}"
                    data-nav="users">
                    <i class="fas fa-users admin-nav-icon"></i>
                    <span class="admin-nav-text" data-i18n="nav.users">Users</span>
                </a>

                <!-- Communication -->
                <a href="/admin/communication"
                    class="admin-nav-item {% if request.url.path.startswith('/admin/communication') %}active{% endif %}"
                    data-nav="communication">
                    <i class="fas fa-envelope admin-nav-icon"></i>
                    <span class="admin-nav-text" data-i18n="nav.communication">Communication</span>
                </a>

                <!-- Analytics & Reports -->
                <a href="/admin/analytics"
                    class="admin-nav-item {% if request.url.path.startswith('/admin/analytics') %}active{% endif %}"
                    data-nav="analytics">
                    <i class="fas fa-chart-bar admin-nav-icon"></i>
                    <span class="admin-nav-text" data-i18n="nav.analytics">Analytics</span>
                </a>

                <!-- Governance & Compliance -->
                <a href="/admin/governance"
                    class="admin-nav-item {% if request.url.path.startswith('/admin/governance') %}active{% endif %}"
                    data-nav="governance">
                    <i class="fas fa-gavel admin-nav-icon"></i>
                    <span class="admin-nav-text" data-i18n="nav.governance">Governance</span>
                </a>

                <!-- Data Management -->
                <a href="/admin/data"
                    class="admin-nav-item {% if request.url.path.startswith('/admin/data') %}active{% endif %}"
                    data-nav="data">
                    <i class="fas fa-database admin-nav-icon"></i>
                    <span class="admin-nav-text" data-i18n="nav.data">Data Management</span>
                </a>

                <!-- Security & Audit -->
                <a href="/admin/security"
                    class="admin-nav-item {% if request.url.path.startswith('/admin/security') %}active{% endif %}"
                    data-nav="security">
                    <i class="fas fa-shield-alt admin-nav-icon"></i>
                    <span class="admin-nav-text" data-i18n="nav.security">Security</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="admin-main">
            <!-- Header -->
            <header class="admin-header">
                <div class="admin-header-left">
                    <!-- Mobile menu toggle -->
                    <button class="admin-btn admin-btn-ghost admin-btn-icon d-lg-none" id="sidebar-toggle"
                        data-i18n-aria="nav.toggle_menu">
                        <i class="fas fa-bars"></i>
                    </button>

                    <!-- Breadcrumb -->
                    <nav class="admin-breadcrumb" aria-label="breadcrumb">
                        {% block breadcrumb %}
                        <a href="/admin" class="admin-breadcrumb-item">
                            <i class="fas fa-home"></i>
                            <span data-i18n="nav.dashboard">Dashboard</span>
                        </a>
                        {% endblock %}
                    </nav>
                </div>

                <div class="admin-header-right">
                    <!-- Language Switcher -->
                    <div class="admin-language-switcher admin-dropdown">
                        <button class="admin-btn admin-btn-ghost admin-dropdown-trigger"
                            data-i18n-aria="nav.language_switch">
                            <i class="fas fa-globe"></i>
                            <span class="admin-language-current">
                                <span class="admin-language-flag">🇺🇸</span>
                                <span data-i18n="language.en">EN</span>
                            </span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="admin-dropdown-menu">
                            <!-- Language options will be populated by JavaScript -->
                        </div>
                    </div>

                    <!-- User Menu -->
                    <div class="admin-user-menu admin-dropdown">
                        <button class="admin-btn admin-btn-ghost admin-dropdown-trigger" data-i18n-aria="nav.user_menu">
                            <div class="admin-user-avatar">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <span class="admin-user-name">{{ current_user.name if current_user else 'Admin' }}</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="admin-dropdown-menu">
                            <a href="/admin/profile" class="admin-dropdown-item">
                                <i class="fas fa-user"></i>
                                <span data-i18n="nav.profile">Profile</span>
                            </a>
                            <a href="/admin/settings" class="admin-dropdown-item">
                                <i class="fas fa-cog"></i>
                                <span data-i18n="nav.settings">Settings</span>
                            </a>
                            <div class="admin-dropdown-divider"></div>
                            <a href="/auth/logout" class="admin-dropdown-item">
                                <i class="fas fa-sign-out-alt"></i>
                                <span data-i18n="nav.logout">Logout</span>
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="admin-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Admin Components JavaScript -->
    <script src="/static/js/admin_components.js"></script>

    <!-- Admin Internationalization JavaScript -->
    <script src="/static/js/admin_i18n.js"></script>

    <!-- Chart.js for analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Bootstrap JavaScript (for compatibility) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_scripts %}{% endblock %}

    <!-- Admin Initialization Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Initialize admin interface
            initializeAdminInterface();

            // Setup sidebar toggle for mobile
            setupSidebarToggle();

            // Initialize any page-specific functionality
            {% block page_scripts %} {% endblock %}
        });

        function initializeAdminInterface() {
            // Set up global error handling
            window.addEventListener('error', function (e) {
                console.error('Admin interface error:', e.error);
                // Show user-friendly error notification
                if (window.AdminComponents) {
                    window.AdminComponents.showNotification({
                        type: 'error',
                        title: 'Error',
                        message: 'An unexpected error occurred. Please refresh the page.'
                    });
                }
            });

            // Set up global unhandled promise rejection handling
            window.addEventListener('unhandledrejection', function (e) {
                console.error('Unhandled promise rejection:', e.reason);
                if (window.AdminComponents) {
                    window.AdminComponents.showNotification({
                        type: 'error',
                        title: 'Error',
                        message: 'A background operation failed. Please try again.'
                    });
                }
            });
        }

        function setupSidebarToggle() {
            const sidebar = document.getElementById('admin-sidebar');
            const layout = document.getElementById('admin-layout');
            const toggle = document.getElementById('sidebar-toggle');

            if (!toggle || !sidebar || !layout) return;

            toggle.addEventListener('click', function () {
                const isOpen = sidebar.classList.contains('open');
                if (isOpen) {
                    sidebar.classList.remove('open');
                    layout.classList.remove('sidebar-open');
                } else {
                    sidebar.classList.add('open');
                    layout.classList.add('sidebar-open');
                }
            });

            // Close sidebar when clicking outside on mobile
            document.addEventListener('click', function (e) {
                if (window.innerWidth < 992) { // lg breakpoint
                    if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                        sidebar.classList.remove('open');
                        layout.classList.remove('sidebar-open');
                    }
                }
            });
        }

        // Global utility functions
        window.AdminUtils = {
            // Format numbers according to current language
            formatNumber: function (number, options = {}) {
                if (window.AdminI18n) {
                    return window.AdminI18n.formatNumber(number, options);
                }
                return number.toLocaleString();
            },

            // Format dates according to current language
            formatDate: function (date, options = {}) {
                if (window.AdminI18n) {
                    return window.AdminI18n.formatDate(date, options);
                }
                return new Date(date).toLocaleDateString();
            },

            // Format currency according to current language
            formatCurrency: function (amount, currency = 'JOD') {
                if (window.AdminI18n) {
                    return window.AdminI18n.formatCurrency(amount, currency);
                }
                return amount.toLocaleString() + ' ' + currency;
            },

            // Show loading state
            showLoading: function (element, text = 'Loading...') {
                if (typeof element === 'string') {
                    element = document.querySelector(element);
                }
                if (element) {
                    element.innerHTML = `
                        <div class="admin-loading">
                            <div class="admin-spinner"></div>
                            <span>${text}</span>
                        </div>
                    `;
                }
            },

            // Hide loading state
            hideLoading: function (element) {
                if (typeof element === 'string') {
                    element = document.querySelector(element);
                }
                if (element) {
                    const loading = element.querySelector('.admin-loading');
                    if (loading) {
                        loading.remove();
                    }
                }
            },

            // Confirm action with modal
            confirm: function (options = {}) {
                const {
                    title = 'Confirm Action',
                    message = 'Are you sure you want to proceed?',
                    confirmText = 'Confirm',
                    cancelText = 'Cancel',
                    type = 'warning'
                } = options;

                return new Promise((resolve) => {
                    if (window.AdminComponents) {
                        const modal = window.AdminComponents.createModal({
                            title,
                            content: `<p>${message}</p>`,
                            buttons: [
                                {
                                    text: cancelText,
                                    variant: 'secondary',
                                    onClick: () => {
                                        window.AdminComponents.closeModal(modal);
                                        resolve(false);
                                    }
                                },
                                {
                                    text: confirmText,
                                    variant: type === 'error' ? 'error' : 'primary',
                                    onClick: () => {
                                        window.AdminComponents.closeModal(modal);
                                        resolve(true);
                                    }
                                }
                            ]
                        });
                    } else {
                        // Fallback to browser confirm
                        resolve(confirm(message));
                    }
                });
            }
        };
    </script>
</body>

</html>
