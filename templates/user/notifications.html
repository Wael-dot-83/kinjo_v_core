{% extends "base.html" %}

{% block title %}{% if ui_lang == 'en' %}Notifications - KinJo{% else %}الإشعارات - كينجو{% endif %}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="bi bi-bell text-primary"></i> الإشعارات</h2>
                <button class="btn btn-outline-primary" id="markAllRead">
                    <i class="bi bi-check-all"></i> تحديد الكل كمقروء
                </button>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div id="notificationsList" class="list-group list-group-flush">
                        <!-- Notifications will be loaded here -->
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">جارِ التحميل...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <nav class="mt-4" aria-label="ترقيم صفحات الإشعارات">
                <ul class="pagination justify-content-center" id="pagination">
                    <!-- Pagination will be loaded here -->
                </ul>
            </nav>
        </div>
    </div>
</div>

<script>
    let currentPage = 1;

    async function loadNotifications(page = 1) {
        try {
            const response = await fetch(`/api/notifications?page=${page}&limit=20`, {
                headers: {
                    'Authorization': 'Bearer ' + (localStorage.getItem('kinjo_token') || sessionStorage.getItem('kinjo_token'))
                }
            });

            if (response.ok) {
                const data = await response.json();
                renderNotifications(data.items || data);
            } else {
                document.getElementById('notificationsList').innerHTML =
                    '<div class="text-center py-5 text-muted">فشل في تحميل الإشعارات</div>';
            }
        } catch (error) {
            document.getElementById('notificationsList').innerHTML =
                '<div class="text-center py-5 text-muted">حدث خطأ أثناء تحميل الإشعارات</div>';
        }
    }

    function renderNotifications(notifications) {
        const container = document.getElementById('notificationsList');

        if (!notifications || notifications.length === 0) {
            container.innerHTML = `
            <div class="text-center py-5">
                <i class="bi bi-bell-slash display-4 text-muted"></i>
                <p class="mt-3 text-muted">لا توجد إشعارات</p>
            </div>
        `;
            return;
        }

        container.innerHTML = notifications.map(n => `
        <a href="#" class="list-group-item list-group-item-action ${n.read ? '' : 'bg-light'}" 
           onclick="markAsRead(${n.id})">
            <div class="d-flex w-100 justify-content-between">
                <h6 class="mb-1">
                    ${n.read ? '' : '<span class="badge bg-primary me-2">جديد</span>'}
                    ${n.title || 'إشعار'}
                </h6>
                <small class="text-muted">${formatDate(n.created_at)}</small>
            </div>
            <p class="mb-1 text-muted">${n.message || ''}</p>
        </a>
    `).join('');
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        return date.toLocaleDateString('ar-JO', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    async function markAsRead(notificationId) {
        try {
            await fetch(`/api/notifications/${notificationId}/read`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + (localStorage.getItem('kinjo_token') || sessionStorage.getItem('kinjo_token'))
                }
            });
            loadNotifications(currentPage);
        } catch (error) {
            console.error('Error marking notification as read:', error);
        }
    }

    document.getElementById('markAllRead').addEventListener('click', async function () {
        try {
            await fetch('/api/notifications/read-all', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + (localStorage.getItem('kinjo_token') || sessionStorage.getItem('kinjo_token'))
                }
            });
            loadNotifications(currentPage);
            Swal.fire({
                icon: 'success',
                title: 'تم',
                text: 'تم تحديد جميع الإشعارات كمقروءة',
                timer: 1500,
                showConfirmButton: false
            });
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'خطأ',
                text: 'فشل في تحديد الإشعارات كمقروءة'
            });
        }
    });

    // Load notifications on page load
    loadNotifications();
</script>
{% endblock %}
