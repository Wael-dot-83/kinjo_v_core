<!-- New Message Modal -->
<div class="modal fade" id="newMessageModal" tabindex="-1" aria-labelledby="newMessageModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="newMessageModalLabel">رسالة جديدة</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body">
                <form id="newMessageForm">
                    <div class="mb-3">
                        <label for="msgSubject" class="form-label">الموضوع</label>
                        <input type="text" class="form-control" id="msgSubject" required>
                    </div>
                    <div class="mb-3">
                        <label for="msgType" class="form-label">نوع الرسالة</label>
                        <select class="form-select" id="msgType">
                            <option value="broadcast">إعلان عام (للجميع)</option>
                            <option value="direct">رسالة مباشرة (تتطلب معرِّف المتلقِّي)</option>
                        </select>
                    </div>
                    <div class="mb-3" id="recipientField" style="display:none;">
                        <label for="msgRecipient" class="form-label">معرِّف المستخدم المُتلقِّي</label>
                        <input type="number" class="form-control" id="msgRecipient" placeholder="رقم المستخدم">
                    </div>
                    <div class="mb-3">
                        <label for="msgBody" class="form-label">نص الرسالة</label>
                        <textarea class="form-control" id="msgBody" rows="4" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary" onclick="submitMessage()">إرسال</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('msgType').addEventListener('change', function() {
        const recipientDiv = document.getElementById('recipientField');
        if (this.value === 'direct') {
            recipientDiv.style.display = 'block';
        } else {
            recipientDiv.style.display = 'none';
        }
    });

    async function submitMessage() {
        const type = document.getElementById('msgType').value;
        const subject = document.getElementById('msgSubject').value;
        const body = document.getElementById('msgBody').value;
        const recipientId = document.getElementById('msgRecipient').value;
        const token = localStorage.getItem('access_token');

        const payload = {
            subject: subject,
            message_body: body,
            thread_type: type === 'broadcast' ? 'broadcast' : 'direct',
            recipient_id: type === 'direct' ? parseInt(recipientId) : null
        };

        try {
            const response = await fetch('/comm/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                // Close modal and refresh
                const modal = bootstrap.Modal.getInstance(document.getElementById('newMessageModal'));
                modal.hide();
                // If on messages page, refresh
                if (typeof loadMessages === 'function') {
                    loadMessages();
                }
                alert('تم الإرسال بنجاح');
                // Reset form
                document.getElementById('newMessageForm').reset();
            } else {
                const err = await response.json();
                alert('فشل الإرسال: ' + (err.detail || response.statusText));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('حدث خطأ أثناء الإرسال');
        }
    }
</script>
