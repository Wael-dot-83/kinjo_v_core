<!-- New Survey Modal -->
<div class="modal fade" id="newSurveyModal" tabindex="-1" aria-labelledby="newSurveyModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="newSurveyModalLabel">إنشاء استبيان جديد</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body">
                <form id="newSurveyForm">
                    <div class="mb-3">
                        <label for="surveyTitle" class="form-label">عنوان الاستبيان</label>
                        <input type="text" class="form-control" id="surveyTitle" required>
                    </div>
                    <div class="mb-3">
                        <label for="surveyDescription" class="form-label">الوصف</label>
                        <textarea class="form-control" id="surveyDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="surveyNPS" checked>
                        <label class="form-check-label" for="surveyNPS">تفعيل سؤال صافي نقاط الترويج (NPS)</label>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="surveyStart" class="form-label">تاريخ البداية</label>
                            <input type="date" class="form-control" id="surveyStart" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="surveyEnd" class="form-label">تاريخ النهاية</label>
                            <input type="date" class="form-control" id="surveyEnd" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary" onclick="createNewSurvey()">إنشاء</button>
            </div>
        </div>
    </div>
</div>

<script>
    async function createNewSurvey() {
        // Use centralized auth system
        if (!window.AuthService || !AuthService.isAuthenticated()) {
            alert('يرجى تسجيل الدخول لإنشاء استبيان');
            return;
        }

        const token = AuthService.getToken();

        const payload = {
            title: document.getElementById('surveyTitle').value,
            description: document.getElementById('surveyDescription').value,
            nps_question_enabled: document.getElementById('surveyNPS').checked,
            start_date: document.getElementById('surveyStart').value,
            end_date: document.getElementById('surveyEnd').value
        };

        if (!payload.title || !payload.start_date || !payload.end_date) {
            alert('يرجى تعبئة الحقول المطلوبة');
            return;
        }

        try {
            const response = await fetch('/comm/surveys', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const modal = bootstrap.Modal.getInstance(document.getElementById('newSurveyModal'));
                modal.hide();
                if (typeof loadSurveys === 'function') {
                    loadSurveys();
                }
                alert('تم إنشاء الاستبيان بنجاح');
                document.getElementById('newSurveyForm').reset();
            } else {
                const err = await response.json();
                alert('فشل الإنشاء: ' + (err.detail || response.statusText));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('حدث خطأ في الاتصال');
        }
    }
</script>
