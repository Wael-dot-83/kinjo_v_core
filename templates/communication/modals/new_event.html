{% from 'components/confirm-modal.html' import modal_footer %}
<!-- New Event Modal -->
<div class="modal fade" id="newEventModal" tabindex="-1" aria-labelledby="newEventModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="newEventModalLabel">إضافة فعالية جديدة</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body">
                <form id="newEventForm">
                    <div class="mb-3">
                        <label for="eventTitle" class="form-label">عنوان الفعالية</label>
                        <input type="text" class="form-control" id="eventTitle" required>
                    </div>
                    <div class="mb-3">
                        <label for="eventType" class="form-label">نوع الفعالية</label>
                        <select class="form-select" id="eventType">
                            <option value="meeting">اجتماع</option>
                            <option value="holiday">عطلة</option>
                            <option value="activity">نشاط</option>
                            <option value="other">أخرى</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="eventStart" class="form-label">البداية</label>
                            <input type="datetime-local" class="form-control" id="eventStart" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="eventEnd" class="form-label">النهاية</label>
                            <input type="datetime-local" class="form-control" id="eventEnd" required>
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="eventConsent">
                        <label class="form-check-label" for="eventConsent">يتطلب موافقة ولي الأمر</label>
                    </div>
                    <div class="mb-3">
                        <label for="eventDescription" class="form-label">الوصف</label>
                        <textarea class="form-control" id="eventDescription" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary" onclick="submitEvent()">حفظ</button>
            </div>
        </div>
    </div>
</div>

<script>
    async function submitEvent() {
        // Use centralized auth system
        if (!window.AuthService || !AuthService.isAuthenticated()) {
            alert('يرجى تسجيل الدخول لإنشاء حدث');
            return;
        }

        const token = AuthService.getToken();

        const payload = {
            title: document.getElementById('eventTitle').value,
            type: document.getElementById('eventType').value,
            start_at: document.getElementById('eventStart').value,
            end_at: document.getElementById('eventEnd').value,
            description: document.getElementById('eventDescription').value,
            requires_consent_flag: document.getElementById('eventConsent') ? document.getElementById('eventConsent').checked : false
        };

        // Basic validation
        if (!payload.title || !payload.start_at || !payload.end_at) {
            alert('يرجى تعبئة جميع الحقول المطلوبة');
            return;
        }

        try {
            const response = await fetch('/comm/events', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const modal = bootstrap.Modal.getInstance(document.getElementById('newEventModal'));
                modal.hide();
                if (typeof loadEvents === 'function') {
                    loadEvents();
                }
                alert('تم حفظ الفعالية');
                document.getElementById('newEventForm').reset();
            } else {
                const err = await response.json();
                alert('فشل الحفظ: ' + (err.detail || 'Error'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('حدث خطأ في الاتصال');
        }
    }
</script>
