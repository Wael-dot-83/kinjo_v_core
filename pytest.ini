[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    security: marks tests as security tests
    p0: high priority tests (gating)
    p1: medium priority tests (non-blocking by default)
filterwarnings =
    # WARNING GATE: repository DeprecationWarnings are promoted to errors so a new
    # deprecation (datetime.utcnow, SQLAlchemy legacy .get(), sqlite adapters, …)
    # fails the suite instead of accumulating silently. pytest checks filters in
    # reverse order, so this lowest-priority `error` catches everything the
    # documented third-party `ignore`s below do not. Starlette's own warnings
    # subclass UserWarning (not DeprecationWarning) and are handled by message.
    error::DeprecationWarning
    ignore::DeprecationWarning:passlib.*
    ignore::PendingDeprecationWarning:starlette.*
    # Third-party, unavoidable without a dependency upgrade (deferred to avoid an
    # unscoped bump). Each is scoped to the originating module + message so a
    # NEW repository warning is never hidden by these entries:
    #  - slowapi calls the deprecated asyncio.iscoroutinefunction (fires on every
    #    rate-limited request); fixed upstream only in unreleased slowapi.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.*
    #  - Starlette's TestClient still imports httpx under a deprecated path (fired
    #    once at import, re-exported through fastapi.testclient); test harness
    #    only, never runs in production. Matched by its specific message so it
    #    cannot mask a repository warning.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning
    #  - slowapi internally references the deprecated HTTP_422 constant name
    #    (KinJo's own code was migrated off it). Scoped to slowapi + the message.
    ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated:Warning:slowapi.*
    #  - Celery eager mode (used in tests) warns that eager results are not
    #    stored; expected under task_always_eager, never a production path.
    ignore:Results are not stored in backend:RuntimeWarning:celery.*
