services:
  db:
    image: postgres:15
    container_name: kinjo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinjo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-kinjo_db}
    volumes:
      - kinjo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kinjo} -d ${POSTGRES_DB:-kinjo_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kinjo_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Host port is configurable so this file matches what production actually
      # runs. The live server sits behind Cloudflare and must publish on 80, and
      # that was previously a hand edit to this file on the box — the same kind
      # of untracked drift that once left production running uncommitted code.
      # Set KINJO_WEB_PORT=80 in the server's .env; everywhere else keeps 8000.
      - "${KINJO_WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinjo}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:-kinjo_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://your-domain.example}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ${KINJO_WEB_COMMAND:-supervisord -c /app/supervisor.conf}

  # Background processing. Production ran neither of these: .env sets
  # KINJO_WEB_COMMAND to a bare uvicorn, which overrides compose's supervisord
  # default -- and supervisor.conf only ever started uvicorn anyway. So no
  # scheduled export, queued message dispatch, heatmap rebuild or automated
  # backup has been running at all. Declaring them as services makes their
  # absence visible in `docker compose ps` instead of silent.
  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinjo}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:-kinjo_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
    volumes:
      - ./data:/app/data
    command: celery -A celery_app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinjo}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:-kinjo_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
    volumes:
      - ./data:/app/data
    # Exactly one beat: a second scheduler publishes every periodic task twice.
    command: celery -A celery_app.celery_app beat --loglevel=info
    depends_on:
      - redis

volumes:
  kinjo_pgdata:
