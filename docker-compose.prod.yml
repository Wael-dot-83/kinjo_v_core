services:
  db:
    image: postgres:15
    container_name: kinjo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinjo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-kinjo_db}
    volumes:
      - kinjo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kinjo} -d ${POSTGRES_DB:-kinjo_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kinjo_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Host port is configurable so this file matches what production actually
      # runs, rather than being hand-edited on the box — the same kind of
      # untracked drift that once left production running uncommitted code.
      #
      # The default binds LOOPBACK only. It used to default to "8000", which is
      # shorthand for 0.0.0.0:8000 and published the app to the whole internet in
      # plaintext. ufw does not contain that: Docker installs its own DOCKER-USER
      # iptables rules that bypass the firewall, so a published port is reachable
      # even while ufw claims to deny it. Local development is unaffected —
      # http://127.0.0.1:8000 still works.
      #
      # With the TLS edge deployed (docker-compose.edge.yml), leave this at the
      # default: nginx reaches the app over the compose network, and loopback
      # publishing stays available for on-box debugging.
      - "${KINJO_WEB_PORT:-127.0.0.1:8000}:8000"
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinjo}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:-kinjo_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://your-domain.example}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ${KINJO_WEB_COMMAND:-supervisord -c /app/supervisor.conf}

  # Background processing. Production ran neither of these: .env sets
  # KINJO_WEB_COMMAND to a bare uvicorn, which overrides compose's supervisord
  # default -- and supervisor.conf only ever started uvicorn anyway. So no
  # scheduled export, queued message dispatch, heatmap rebuild or automated
  # backup has been running at all. Declaring them as services makes their
  # absence visible in `docker compose ps` instead of silent.
  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinjo}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:-kinjo_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
      # The celery console script puts its own bin directory on sys.path rather
      # than the working directory, so top-level modules like child_age_policy
      # fail to import inside tasks even though they sit in /app. uvicorn does
      # not have this problem, which is why only background work broke.
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
    command: celery -A celery_app.celery_app worker --loglevel=info --concurrency=2
    # The image declares an HTTP HEALTHCHECK for the web container. Docker applies
    # it to every service built from that image, so worker and beat -- which serve
    # no HTTP port -- were permanently "unhealthy" while working perfectly. That is
    # worse than no check: it trains operators to ignore the column that is supposed
    # to tell them the queue is dead. Replaced with one that actually pings celery.
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app.celery_app inspect ping -t 10 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kinjo}:${POSTGRES_PASSWORD:?required}@db:5432/${POSTGRES_DB:-kinjo_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
      # Same sys.path caveat as the worker.
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
    # Exactly one beat: a second scheduler publishes every periodic task twice.
    command: celery -A celery_app.celery_app beat --loglevel=info
    # beat has no inspectable queue of its own, so there is nothing meaningful to
    # ping. Disable the inherited HTTP check rather than let it report a false
    # failure forever; liveness is the process staying up under restart policy.
    healthcheck:
      disable: true
    depends_on:
      - redis

volumes:
  kinjo_pgdata:
