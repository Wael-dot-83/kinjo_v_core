name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [ main ]
  # Weekly run so dependency-audit catches an advisory published while nobody is
  # pushing — a push-only audit goes stale during exactly the quiet period before
  # a release. The other jobs riding along also catch environment bit-rot (a new
  # transitive release breaking the build) before it surprises a deploy.
  schedule:
    - cron: '0 3 * * 1'

# The product is anchored to Jordan time (UTC+3) and the application computes
# every operational date in that zone. Runners default to UTC, so between
# 21:00 and 24:00 UTC the runner's calendar date is already yesterday relative
# to Jordan, and every test that seeds or asserts with date.today() disagrees
# with the app by one day. That made CI fail for three hours out of every
# twenty-four regardless of what was being changed. Running the suite in the
# application's own timezone removes the discrepancy at its source.
#
# This is not a substitute for the deeper fix: those tests should derive dates
# from the Jordan helper rather than the system clock, which would make them
# correct in any zone.
env:
  TZ: Asia/Amman

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff
      - name: Ruff check (pyproject.toml config — E722 + F821)
        run: ruff check .
      - name: Ruff strict checks (expanded rules on core services)
        run: ruff check data_quality_service.py predictive_analytics.py email_service.py api/auth/password_reset_service.py api/analytics/scope_domain.py api/attendance/summary_domain.py --select F401,F841,I001

  # Fast structural gate. 4f98904d reached main with an IndentationError that made
  # `from main import app` fail outright, plus a deleted stylesheet four templates
  # still linked. Both are cheap to detect and neither needs the full suite, so
  # they run before the long jobs rather than behind them.
  smoke:
    runs-on: ubuntu-latest
    needs: lint
    env:
      SECRET_KEY: ci-smoke-secret-key-not-for-production
      DATABASE_URL: "sqlite:///:memory:"
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile every source file
        run: python -m compileall -q . -x '(\.venv|venv|node_modules|_archived_dead_code|__pycache__)'

      - name: Application imports and registers its routes
        run: |
          python - <<'PY'
          from starlette.routing import Mount
          from main import app

          def walk(router, prefix=""):
              for route in getattr(router, "routes", []):
                  if isinstance(route, Mount):
                      continue
                  if type(route).__name__ == "_IncludedRouter":
                      ctx = getattr(route, "include_context", None)
                      if ctx:
                          nested = f"{prefix.rstrip('/')}/{(ctx.prefix or '').lstrip('/')}".replace("//", "/")
                          yield from walk(ctx.included_router, nested)
                      continue
                  if hasattr(route, "path"):
                      for m in (getattr(route, "methods", None) or {"WS"}):
                          if m in ("HEAD", "OPTIONS"):
                              continue
                          yield (m, f"{prefix.rstrip('/')}/{route.path.lstrip('/')}".replace("//", "/"))

          pairs = list(walk(app))
          assert len(pairs) > 500, f"route registration collapsed: only {len(pairs)} routes"

          from collections import Counter
          dupes = {k: v for k, v in Counter(pairs).items() if v > 1}
          assert not dupes, f"duplicate (method, path) registrations: {dupes}"
          print(f"OK: {len(pairs)} routes, no duplicates")
          PY

      - name: Static assets and CSRF boundary
        run: pytest tests/test_static_asset_integrity.py tests/test_csrf_double_submit_contract.py -q --timeout=60

  test:
    runs-on: ubuntu-latest
    needs: smoke
    env:
      SECRET_KEY: test-secret
      DATABASE_URL: "sqlite:///:memory:"
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run P0 tests
        run: pytest -m "p0" --timeout=30 --maxfail=3 -q

      - name: Run full tests with coverage
        run: pytest tests/ --timeout=30 --cov=. --cov-report=xml -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  migrations:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kinjo
          POSTGRES_PASSWORD: kinjo
          POSTGRES_DB: kinjo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kinjo:kinjo@localhost:5432/kinjo_test
      SECRET_KEY: ci-secret-key
      REDIS_URL: redis://localhost:6379/0
      TESTING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        # requirements-dev.txt, not requirements.txt: this job's second step runs
        # pytest, and pytest is only in the dev file. With the runtime file alone
        # the step died with exit 127 (command not found) and no output, which is
        # why the failure looked mysterious. requirements-dev.txt begins with
        # `-r requirements.txt`, so the alembic step above keeps every runtime
        # dependency it already had.
        run: pip install -r requirements-dev.txt
      - name: Verify Alembic migrations (upgrade → downgrade → upgrade)
        run: |
          alembic upgrade head
          python scripts/manual-diagnostics/verify_postgres_migration_state.py
          alembic downgrade -1
          alembic upgrade head
          python scripts/manual-diagnostics/verify_postgres_migration_state.py
          alembic downgrade base
          alembic upgrade head
          python scripts/manual-diagnostics/verify_postgres_migration_state.py
      - name: Migration drift tests against real PostgreSQL
        # These skip themselves without a postgresql:// URL, so they are near-useless in the
        # `test` job (SQLite) and load-bearing here. c7d9e1a4b820 passed every SQLite test
        # and still aborted on PostgreSQL: indexes and constraints share one namespace there.
        env:
          MIGRATION_TEST_POSTGRES_URL: postgresql://kinjo:kinjo@localhost:5432/kinjo_test
        run: pytest tests/test_migration_column_drift.py -q

  postgres-parity:
    # Production runs PostgreSQL; the main suite runs SQLite. That gap let three
    # 500s reach production while CI stayed green: func.strftime() (SQLite-only),
    # enum members declared in Python but absent from the PostgreSQL type, and an
    # audit_logs column that was jsonb in the database but Text in the model.
    # SQLite accepts all three.
    #
    # tests/test_postgres_integration.py executes that SQL for real and skips
    # itself when KINJO_TEST_POSTGRES_URL is unset, so it is inert locally and
    # only meaningful here. It gets its own database because its fixture runs
    # drop_all/create_all, which would destroy the analytics-postgres schema if
    # they shared one.
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kinjo
          POSTGRES_PASSWORD: kinjo
          POSTGRES_DB: kinjo_parity_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KINJO_TEST_POSTGRES_URL: postgresql://kinjo:kinjo@localhost:5433/kinjo_parity_test
      SECRET_KEY: ci-secret-key
      DATABASE_URL: "sqlite:///:memory:"
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: PostgreSQL parity suite
        # -rs reports skip reasons. The suite skips itself when no database is
        # reachable, which is correct locally but useless here: a misconfigured
        # service would otherwise look like a pass, which is exactly how the
        # original gap survived. Fail loudly instead.
        run: |
          set -o pipefail
          pytest -q -rs tests/test_postgres_integration.py --timeout=120 \
            | tee parity.log
          if grep -q "KINJO_TEST_POSTGRES_URL not set" parity.log \
             || grep -q "PostgreSQL not reachable" parity.log; then
            echo "::error::parity suite skipped — PostgreSQL was not reachable in CI"
            exit 1
          fi
          if grep -qE "no tests ran|0 (tests )?collected" parity.log; then
            echo "::error::parity suite collected nothing"
            exit 1
          fi

  analytics-postgres:
    # Postgres E2E for the admin analytics work (registry, data-state, drill-down,
    # child_detail RBAC). Runs the analytics test surface against a real Postgres
    # via the opt-in TEST_DATABASE_URL (conftest builds the schema with create_all).
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kinjo
          POSTGRES_PASSWORD: kinjo
          POSTGRES_DB: kinjo_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://kinjo:kinjo@localhost:5432/kinjo_analytics_test
      SECRET_KEY: ci-secret-key
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Analytics suite on Postgres
        run: |
          pytest -q \
            tests/test_metric_registry.py \
            tests/test_data_state_handling.py \
            tests/test_analytics_child_detail_rbac.py \
            tests/test_analytics_rbac.py \
            tests/test_analytics_gap.py \
            tests/test_drilldown_page_frontend_contract.py \
            tests/api/test_p0_analytics_kpi.py \
            tests/api/test_p1_analytics_summary.py \
            tests/api/test_p1_analytics_export.py \
            --timeout=60

  # ---------------------------------------------------------------------------
  # Dependency audit. Runs on every push AND on a schedule, because a dependency
  # becomes vulnerable while nobody is touching the repository — a push-only
  # audit would go stale precisely during a quiet period before a release.
  # ---------------------------------------------------------------------------
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install pip-audit

      - name: Audit runtime dependencies
        # PYSEC-2026-1325 (ecdsa, Minerva timing attack) is accepted, not ignored
        # by neglect: ecdsa arrives transitively via python-jose, upstream has
        # declared side-channel attacks out of scope so no fixed version exists,
        # and the vulnerable code is ECDSA signing/keygen/ECDH. KinJo signs JWTs
        # with HS256 and validate_production_settings() now REJECTS any non-HMAC
        # algorithm in production, so the vulnerable path is unreachable by
        # construction rather than by convention.
        #
        # Re-evaluate if: python-jose drops the ecdsa dependency, upstream ships
        # a fix, or the HMAC-only guard in config.py is ever relaxed.
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-1325 \
            --progress-spinner off

      - name: Report the accepted advisory (non-blocking, for visibility)
        if: always()
        run: |
          echo "Accepted advisories (not failing the build):"
          pip-audit -r requirements.txt --progress-spinner off || true
