name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff strict checks (expanded rules on core services)
        run: ruff check data_quality_service.py predictive_analytics.py email_service.py api/auth/password_reset_service.py api/analytics/scope_domain.py api/attendance/summary_domain.py --select F401,F841,I001
      - name: Install frontend lint dependencies
        run: npm install
      - name: ESLint check
        run: npm run lint:js

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      SECRET_KEY: test-secret
      DATABASE_URL: "sqlite:///:memory:"
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: Run P0 tests
        run: pytest -m "p0" --timeout=30 --maxfail=3 -q

      - name: Run full tests with coverage
        run: pytest tests/ --timeout=30 --cov=. --cov-report=xml -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
