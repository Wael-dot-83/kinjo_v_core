name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff
      - name: Ruff check (pyproject.toml config — E722 + F821)
        run: ruff check .
      - name: Ruff strict checks (expanded rules on core services)
        run: ruff check data_quality_service.py predictive_analytics.py email_service.py api/auth/password_reset_service.py api/analytics/scope_domain.py api/attendance/summary_domain.py --select F401,F841,I001

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      SECRET_KEY: test-secret
      DATABASE_URL: "sqlite:///:memory:"
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run P0 tests
        run: pytest -m "p0" --timeout=30 --maxfail=3 -q

      - name: Run full tests with coverage
        run: pytest tests/ --timeout=30 --cov=. --cov-report=xml -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  migrations:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kinjo
          POSTGRES_PASSWORD: kinjo
          POSTGRES_DB: kinjo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kinjo:kinjo@localhost:5432/kinjo_test
      SECRET_KEY: ci-secret-key
      REDIS_URL: redis://localhost:6379/0
      TESTING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify Alembic migrations (upgrade → downgrade → upgrade)
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
