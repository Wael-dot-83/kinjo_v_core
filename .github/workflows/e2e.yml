name: Playwright E2E Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # The Playwright suite drives the real app: it calls the dev auto-login
      # endpoint (only enabled when TESTING=true + ENVIRONMENT=development) and
      # then exercises /admin/analytics with mocked API responses. The backend
      # therefore has to be running and seeded before `npx playwright test`.
      TESTING: "true"
      ENVIRONMENT: development
      SECRET_KEY: ci-secret-key
      DATABASE_URL: "sqlite:///./e2e.db"
      REDIS_URL: redis://localhost:6379/0
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:8000,http://localhost:8000"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install Python dependencies
      run: pip install -r requirements.txt
    - name: Install Node dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Seed database
      run: python scripts/seed_local.py
    - name: Start backend
      run: |
        python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
        echo "Waiting for backend to become healthy..."
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:8000/health > /dev/null; then
            echo "Backend is up."; exit 0
          fi
          sleep 1
        done
        echo "Backend did not become healthy in time" >&2
        exit 1
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
