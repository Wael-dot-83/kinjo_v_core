services:
  db:
    image: postgres:15
    container_name: kinjo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KINJO_POSTGRES_USER:-kinjo}
      POSTGRES_PASSWORD: ${KINJO_POSTGRES_PASSWORD:-kinjo_dev_password}
      POSTGRES_DB: ${KINJO_POSTGRES_DB:-kinjo_db}
    ports:
      - "5432:5432"
    volumes:
      - kinjo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KINJO_POSTGRES_USER:-kinjo} -d ${KINJO_POSTGRES_DB:-kinjo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kinjo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://kinjo:kinjo_dev_password@db:5432/kinjo_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-change-me-for-local-dev-only-change-before-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-127.0.0.1,localhost,testserver}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ${KINJO_WEB_COMMAND:-supervisord -c /app/supervisor.conf}

volumes:
  kinjo_pgdata:
