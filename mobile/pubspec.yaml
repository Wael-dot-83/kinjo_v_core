name: kinjo_mobile
description: "KinJo Mobile Application - Cross-platform mobile app for Parents, Supervisors, and Managers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & HTTP
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # State Management & Routing
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  go_router: ^13.2.0

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Localization & Utilities
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  local_auth: ^2.1.8

  # Geolocation & Maps
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3

  # UI Components
  flutter_spinkit: ^5.2.0
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
