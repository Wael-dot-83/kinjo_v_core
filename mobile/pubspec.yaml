name: kinjo_mobile
description: "KinJo Mobile Application - Cross-platform mobile app for Parents, Supervisors, and Managers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Only what lib/ actually imports. The list previously declared 18 packages
  # of which 14 were never imported anywhere — flutter_bloc, equatable,
  # go_router, shared_preferences, hive, hive_flutter, intl, flutter_svg,
  # cached_network_image, local_auth, geolocator, google_maps_flutter,
  # flutter_spinkit and badges. They advertised state management, routing,
  # offline storage, biometrics and maps that do not exist in this app, and
  # each one is a platform plugin the Android and iOS builds have to carry.
  # Add them back alongside the code that uses them.

  # Networking & HTTP
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Storage & Security
  flutter_secure_storage: ^9.0.0

  # Typography
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
