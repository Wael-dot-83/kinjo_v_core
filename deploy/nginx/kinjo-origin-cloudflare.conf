# =============================================================================
# KinJo — origin TLS for a Cloudflare-proxied zone.
#
# Use this INSTEAD OF deploy/nginx/kinjo.conf when Cloudflare sits in front.
# The two are not interchangeable:
#
#   kinjo.conf                   terminates TLS for the public and redirects
#                                HTTP -> HTTPS. Behind Cloudflare in Flexible
#                                mode that redirect is an INFINITE LOOP: the edge
#                                speaks HTTP to the origin, gets a 301 to HTTPS,
#                                and comes back over HTTP again.
#
#   kinjo-origin-cloudflare.conf (this file) terminates TLS for CLOUDFLARE only,
#                                on 443, with no redirect. Port 80 is left to the
#                                app until the zone is switched to Full (strict),
#                                so the cutover is non-breaking in either order.
#
# The certificate is a Cloudflare Origin CA certificate. It is trusted ONLY by
# Cloudflare — a browser reaching the origin directly would reject it, which is
# fine and expected: the origin firewall only admits Cloudflare anyway.
# =============================================================================

upstream kinjo_app {
    server web:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name kinjordan.org www.kinjordan.org;

    ssl_certificate     /etc/nginx/origin/cert.pem;
    ssl_certificate_key /etc/nginx/origin/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No OCSP stapling: the Origin CA is a private CA and publishes no responder
    # that a public client would consult. Enabling it only logs a warning.

    server_tokens off;

    # HSTS, CSP, nosniff and X-Frame-Options are emitted by the application
    # (middleware/security.py) and pass through unchanged. They are deliberately
    # NOT repeated here — a second CSP header is intersected by browsers, not
    # replaced, which silently breaks pages.

    client_max_body_size 12m;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location /ws/ {
        proxy_pass http://kinjo_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://kinjo_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Cloudflare already set X-Forwarded-For to the real client. Appending
        # rather than replacing keeps that chain intact, so uvicorn — which walks
        # the chain right-to-left skipping trusted hops — still resolves the true
        # client address. This is why KINJO_FORWARDED_ALLOW_IPS must list BOTH the
        # Cloudflare ranges and this container's network.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Always https: this server block only ever serves TLS, and the app uses
        # this to decide secure-cookie and HSTS behaviour.
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_intercept_errors off;
    }

    location = /health {
        proxy_pass http://kinjo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }
}
