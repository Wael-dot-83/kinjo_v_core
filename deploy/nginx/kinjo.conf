# =============================================================================
# KinJo — Nginx reverse proxy (TLS termination on the droplet)
#
# Until now the `web` container published straight to host :80 and TLS existed
# only at Cloudflare. That leaves the origin reachable over plaintext by anyone
# who learns the droplet IP, and it means the app sees Cloudflare's address as
# the client. This config terminates TLS on the box itself, so the origin is
# encrypted end to end and the proxy chain is explicit.
#
# Served by the `nginx` service in docker-compose.edge.yml, which is the only
# container publishing host ports. `web` is reachable only on the compose
# network after that change.
# =============================================================================

upstream kinjo_app {
    server web:8000;
    keepalive 32;
}

# Rate limit zones. The login and API surfaces get separate buckets so a burst of
# dashboard polling can never consume the budget that protects authentication.
# The app also rate-limits in Redis; this is the cheaper outer fence that sheds
# load before it reaches Python at all.
limit_req_zone $binary_remote_addr zone=kinjo_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=kinjo_api:10m   rate=20r/s;
limit_conn_zone $binary_remote_addr zone=kinjo_conn:10m;

# Long-lived upgrade mapping for /ws/dashboard.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP: ACME challenge + permanent redirect -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${KINJO_DOMAIN} www.${KINJO_DOMAIN};

    # Certbot webroot. Must stay on plain HTTP — renewals fail if this redirects.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${KINJO_DOMAIN} www.${KINJO_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${KINJO_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${KINJO_DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${KINJO_DOMAIN}/chain.pem;

    # TLS 1.2+ only. 1.0/1.1 are deprecated and fail a PCI/ASV scan.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # HSTS is set here rather than only in the app so it also covers responses
    # nginx serves itself (errors, redirects, static files).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # NOTE: Content-Security-Policy and X-Frame-Options are deliberately NOT set
    # here. middleware/security.py computes the CSP per response (it varies by
    # page) and an `add_header` at this level would not override the upstream
    # value anyway — it would sit alongside it and browsers would enforce the
    # intersection, silently breaking pages. Keep CSP ownership in the app.

    # Uploads cap at MAX_UPLOAD_SIZE_MB=10; allow headroom for the multipart
    # envelope so the app returns its own 413 with a bilingual body instead of
    # nginx cutting the connection with an opaque error.
    client_max_body_size 12m;
    client_body_timeout 60s;

    # Never advertise the exact nginx build to the internet.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    limit_conn kinjo_conn 64;

    # --- Static assets -------------------------------------------------------
    # Templates cache-bust with ?v=<hash>, so a long immutable TTL is safe and is
    # what makes the versioned URLs worth having. If you ship an asset WITHOUT
    # bumping its ?v=, returning users keep the old file for a year.
    location /static/ {
        # Same proxy headers as every other location. Static requests still pass
        # through the application's middleware stack (there is no static
        # exemption), so omitting these would make asset traffic appear to come
        # from the proxy — one shared rate-limit bucket for every user's assets.
        include /etc/nginx/conf.d/kinjo_proxy_params;
        proxy_pass http://kinjo_app;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Authentication ------------------------------------------------------
    # Tight bucket: 5/min with a small burst absorbs a typo'd password, not a
    # credential-stuffing run.
    location /api/auth/login {
        limit_req zone=kinjo_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/kinjo_proxy_params;
        proxy_pass http://kinjo_app;
    }

    # --- WebSocket -----------------------------------------------------------
    # Headers are spelled out rather than pulled from kinjo_proxy_params on
    # purpose. That file sets `proxy_http_version 1.1` and `Connection ""` for
    # upstream keepalive; including it here and then re-declaring either one is a
    # duplicate-directive error that nginx rejects at startup, taking the whole
    # site down — not just websockets. Keep these two blocks independent.
    location /ws/ {
        proxy_pass http://kinjo_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dashboard sockets idle between pushes; the default 60s would drop them.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- API and application -------------------------------------------------
    location /api/ {
        limit_req zone=kinjo_api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/kinjo_proxy_params;
        proxy_pass http://kinjo_app;
    }

    location / {
        include /etc/nginx/conf.d/kinjo_proxy_params;
        proxy_pass http://kinjo_app;
    }

    # --- Health --------------------------------------------------------------
    # Reachable for uptime probes but kept out of the access log so it does not
    # drown real traffic at a 30s interval.
    location = /health {
        include /etc/nginx/conf.d/kinjo_proxy_params;
        proxy_pass http://kinjo_app;
        access_log off;
    }
}
